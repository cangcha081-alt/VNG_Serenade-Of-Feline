<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>黑猫小夜曲 · 交互式视觉小说</title>
  <meta name="theme-color" content="#0a0812" />
  <link rel="stylesheet" href="../css/main.css" />
  <link rel="stylesheet" href="../css/save.css" />
  <link rel="stylesheet" href="../css/achieve.css" />
  <!-- 进入剧情即作废菜单音乐断点：从剧情回主菜单时音乐从头播（不跨页续播） -->
  <script>try { localStorage.removeItem('vn_pagebgm_sync'); } catch (e) {}</script>
</head>
<body>
  <!--场景背景-->
  <div class="vn-bg" id="vnBg" aria-hidden="true">
    <img class="vn-bg__img" id="vnBgImg" alt="场景背景"
         data-src="assets/images/backgrounds/scene-default.png" />
    <!--氛围层-->
    <div class="vn-bg__fx" aria-hidden="true"></div>
  </div>

  <!--人物立绘（默认收起：等台词真正指定立绘时再由引擎显示。
      否则首屏会先画出「没有 src 的虚线占位框」＝空立绘，返回剧情/进 CG 时闪一下）-->
  <div class="vn-portrait is-hidden" id="vnPortrait" aria-hidden="true">
    <img class="vn-portrait__img" id="vnPortraitImg" alt="人物立绘" />
  </div>

  <!--CG 插图 / CG 视频（台词里写 cg: '键名' 时浮出；位置在背景/立绘之上、对话框之下）-->
  <div class="vn-cg" id="vnCg" aria-hidden="true">
    <img class="vn-cg__img" id="vnCgImg" alt="CG 插图" />
    <video class="vn-cg__video" id="vnCgVideo" playsinline preload="auto"></video>
  </div>

  <!--对话框（默认收起：等第一句演出就绪、引擎调用 VN.dialog.show() 时才显示。
      否则首屏会先画出占位台词框，返回剧情/进 CG 时闪一下）-->
  <section class="vn-dialog is-hidden" id="vnDialog" aria-label="剧情对话框">
    <div class="vn-dialog__frame">
      <h2 class="vn-name" id="vnSpeaker">？？？</h2>
      <p class="vn-text" id="vnText">
        <span class="vn-text__body" id="vnTextBody"></span>
      </p>
      <!--快进提示-->
      <span class="vn-text-hint">长按空格可快进</span>
    </div>
  </section>

  <!--菜单-->
  <nav class="vn-menu" id="vnMenu" aria-label="游戏菜单">
    <div class="vn-menu__buttons">
      <!--存档按钮（菜单按钮旁边）-->
      <button class="vn-menu-toggle vn-menu-toggle--save" id="vnSaveToggle" type="button"
              aria-haspopup="true" aria-expanded="false"
              title="存档 / 读档" aria-label="存档 / 读档">
        <span class="vn-save-toggle__icon" aria-hidden="true"></span>
      </button>

      <!--地图按钮（存档按钮旁边）：点开出现全屏地图浮层-->
      <button class="vn-menu-toggle vn-menu-toggle--map" id="vnMapToggle" type="button"
              aria-haspopup="dialog" aria-expanded="false"
              title="地图" aria-label="地图">
        <span class="vn-map-toggle__icon" aria-hidden="true"></span>
      </button>

      <button class="vn-menu-toggle" id="vnMenuToggle" type="button"
              aria-haspopup="true" aria-expanded="false"
              aria-controls="vnMenuList" title="菜单">
        <span class="vn-menu-toggle__icon" aria-hidden="true"></span>
      </button>
    </div>

    <ul class="vn-menu__list" id="vnMenuList" role="menu" aria-labelledby="vnMenuToggle">
      <li role="none">
        <a class="vn-menu__item" role="menuitem" href="settingPage.html?from=plot.html">设置</a>
      </li>
      <li role="none">
        <a class="vn-menu__item" role="menuitem" href="hall.html">退出游戏</a>
      </li>
    </ul>
  </nav>

  <!--地图浮层（CG0 播完解锁 Zone0 后可看；点击任意处或 Esc 关闭）-->
  <div class="vn-map" id="vnMap" aria-hidden="true">
    <figure class="vn-map__panel" role="dialog" aria-label="地图">
      <figcaption class="vn-map__title">地 图</figcaption>
      <div class="vn-map__frame">
        <img class="vn-map__img" id="vnMapImgBase" alt="当前地图" draggable="false" />
        <img class="vn-map__img vn-map__img--next" id="vnMapImgNext" alt="" draggable="false" />
        <!--地名标注层：所有已解锁地点各悬一枚名称胶囊；人物定位标只负责当前位置-->
        <div class="vn-map__labels" id="vnMapLabels" aria-hidden="true"></div>
        <div class="vn-map__pin" id="vnMapPin" aria-hidden="true">
          <span class="vn-map__pin__dot"></span>
        </div>
      </div>
      <span class="vn-map__hint">点击任意处关闭</span>
    </figure>
  </div>

  <!--地图未解锁提示（地图还锁着时点按钮弹出）-->
  <div class="vn-map-toast" id="vnMapToast" aria-hidden="true">地图还未解锁</div>

  <!--黑场遮罩-->
  <!--黑场遮罩：初始就是「黑」＝首屏遮幕。
      进入/返回本页时先黑屏，等第一句的演出（CG / 章节卡 / 背景）就绪，
      由引擎（main.js 的 liftBootCurtain → VN.scene.revealBlackout）揭幕 ——
      这样就不会先闪出视觉小说的背景、占位对话框与空立绘。
      引擎的 setBlackout() 会写内联 opacity，覆盖下面这个初始值。-->
  <div class="vn-blackout" id="vnBlackout" aria-hidden="true" style="opacity:1;pointer-events:auto"></div>

  <!--CG 载入提示：视频 CG（几十上百 MB）等首帧的这段时间显示，避免整屏黑着像卡死。
      由 main.js 的 CG 模块控制（.is-on 时显现）；页面里没有这个元素也不会报错。-->
  <div class="vn-loading" id="vnLoading" aria-hidden="true"><span>CG 载入中…</span></div>

  <!--章节标题转场：位于黑场(z100)之上的居中标题，opacity 由 VN.scene.playChapterIntro 控制-->
  <div class="vn-chapter" id="vnChapterTitle" aria-hidden="true">
    <p class="vn-chapter__kicker" id="vnChapterKicker"></p>
    <h2 class="vn-chapter__main" id="vnChapterMain"></h2>
  </div>

  <!--存档：模式选择面板 + 6 存档位弹层-->
  <div class="vn-save" id="vnSave" aria-hidden="true">
    <div class="vn-save__backdrop" id="vnSaveBackdrop"></div>

    <!-- 模式选择 -->
    <section class="vn-save__panel" id="vnSavePanel" role="dialog"
             aria-modal="true" aria-label="存档与读档">
      <h2 class="vn-save__title">存档 / 读档</h2>
      <p class="vn-save__hint">选择要进行的操作</p>
      <div class="vn-save__actions">
        <button type="button" class="vn-btn vn-save__mode" data-mode="save">手动存档</button>
        <button type="button" class="vn-btn vn-save__mode" data-mode="load">读取存档</button>
      </div>
      <button type="button" class="vn-btn vn-save__close" id="vnSaveCancel">取消</button>
    </section>

    <!-- 6 个存档位 -->
    <section class="vn-save__modal" id="vnSaveModal" role="dialog" aria-modal="true" hidden>
      <h2 class="vn-save__title" id="vnSaveModalTitle">手动存档</h2>
      <p class="vn-save__hint" id="vnSaveModalHint"></p>
      <div class="vn-save__grid" id="vnSaveSlots"></div>
      <button type="button" class="vn-btn vn-save__close" id="vnSaveBack">返回</button>
    </section>
  </div>

  <!--分账号进度隔离：必须在 saveSystem.js 之前（存档键会据此加 u:<用户>: 前缀）-->
  <script src="../js/userStore.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/saveSystem.js"></script>
  <script src="../js/achieve.js"></script>
  <!-- 全屏设置：与设置页（外壳）联动，跨页保持全屏 -->
  <script src="../js/fullscreenPref.js"></script>
</body>
</html>
